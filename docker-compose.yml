services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      WEB_LOGIN: ${WEB_LOGIN:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ALLOWED_SN: ${ALLOWED_SN:-}
      WEB_MAX_UPLOAD_MB: ${WEB_MAX_UPLOAD_MB:-2048}
    restart: unless-stopped

  worker:
    build: ./worker
    volumes:
      - ./data:/data
      - ./models:/models:ro
      - whisper-cache:/cache
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      LANGUAGE: ${LANGUAGE:-ru}
      THREADS: ${THREADS:-8}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DIAR_CLUSTER_THRESHOLD: ${DIAR_CLUSTER_THRESHOLD:-auto}
      WEB_URL: ${WEB_URL:-}
    restart: unless-stopped

volumes:
  whisper-cache:
